[project]
name = "finanzplaner"
version = "1.0.8"
description = "Local-first household financial planner for DKB Girokonto exports"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "alembic>=1.16.5,<2",
  "argon2-cffi>=25.1.0,<26",
  "babel>=2.17.0,<3",
  "bleach>=6.2.0,<7",
  "fastapi>=0.116.1,<1",
  "httpx>=0.28.1,<1",
  "itsdangerous>=2.2.0,<3",
  "jinja2>=3.1.6,<4",
  "markdown-it-py>=4.0.0,<5",
  "mcp>=1.27.0,<2",
  "pydantic-settings>=2.10.1,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.43,<3",
  "uvicorn>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4.2,<9",
  "pytest-asyncio>=1.1.0,<2",
  "pytest-cov>=6.2.1,<7",
  "ruff>=0.12.12,<1",
]

[project.scripts]
finanzplaner = "finanzplaner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finanzplaner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
